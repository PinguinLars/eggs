"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](default_bg)$username$hostname[](default_bg) \
$directory\
$status\
$fill\
$c\
$cpp\
$cmake\
$gleam\
$go\
$gradle\
$java\
$julia\
$kotlin\
$lua\
$nodejs\
$python\
$rust
$character"""
right_format = "$time"

palette = "uwu"

[palettes.uwu]
time_bg = "#334b4f" # {<rcol(data.colors.starship_time_bg)>}
time = "#cde7ec" # {<rcol(data.colors.starship_time)>}
default_bg = "#004f58" # {<rcol(data.colors.starship_default_bg)>}
default = "#9eeffd" # {<rcol(data.colors.starship_default)>}
succes = "#82d3e1" #{<rcol(data.colors.normal)>}
error = "#ffb4ab" #{<rcol(data.colors.critical)>}

[directory]
format = "[](default_bg)[$read_only$path]($style)[](default_bg) "
style = "bg:default_bg fg:default"
read_only = '󰉐 '
fish_style_pwd_dir_length = 1
truncation_length = 1
use_os_path_sep = false # / everywhere
use_logical_path = true # resolve symlinks

[character]
success_symbol = "[󱞪](succes)"
error_symbol = "[󱞪](error)"

[time]
disabled = false
time_format = "%R"
format = "[](time_bg)[󰅐 $time](bg:time_bg fg:time)"

[username]
show_always = true
style_user = "fg:default bg:default_bg"
style_root = "fg:error bg:default_bg"
format = "[󰧱 $user]($style)"
aliases = { lars = "ashley" } # {< if !school_mode>}

[hostname]
style = "fg:default bg:default_bg"
format = "[@$hostname]($style)"

[status]
disabled = false
map_symbol = true
pipestatus = true
success_style = "fg:default bg:default_bg"
failure_style = "fg:error bg:default_bg"
symbol = ' '
not_executable_symbol = ''
not_found_symbol = '󰍉 '
sigint_symbol = ' '
signal_symbol = '󰞏 '
format = "[](default_bg)[$symbol$status]($style)[](default_bg)"
pipestatus_separator = "[|](default_bg)"
pipestatus_format = "$pipestatus [=>](default) [](default_bg)[$symbol$status]($style)[](default_bg)"

[fill]
symbol = ' '



[c]
format = ' [](default_bg)[$symbol$version|$name]($style)[](default_bg)'
version_format = 'v${major}.${minor}'
symbol = ' '
style = "fg:default bg:default_bg"
commands = [ [ 'clang', '--version' ], [ 'cc', '--version' ], [ 'gcc', '--version' ] ]

[cpp]
format = ' [](default_bg)[$symbol$version|$name]($style)[](default_bg)'
version_format = 'v${major}.${minor}'
symbol = ' '
style = 'fg:default bg:default_bg'
disabled = false
commands = [ ['clang++','--version'], [ 'c++', '--version' ], [ 'g++', '--version' ] ]

[cmake]
format = ' [](default_bg)[$symbol$version]($style)[](default_bg)'
version_format = 'v${raw}'
symbol = ' '
style = 'fg:default bg:default_bg'

